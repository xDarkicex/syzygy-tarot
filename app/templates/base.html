<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}syzygy · tarot{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" />
  <link rel="stylesheet" href="/static/css/site.css" />
  <script src="/static/js/htmx.min.js" defer></script>
  <script src="/static/js/alpine-persist.min.js" defer></script>
  <script src="/static/js/alpine.min.js" defer></script>
</head>
<body x-data="syzygy()">
  <header class="masthead">
    <a class="brand" href="/">
      <span class="brand__mark" aria-hidden="true">✶</span>
      <span class="brand__name">syzygy</span>
      <span class="brand__sub">tarot</span>
    </a>
    <nav class="masthead__nav">
      <a href="/">Draw</a>
      <a href="/history">History</a>
      <a href="/about">About</a>
    </nav>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <p>A modern revisioning of <code>xDarkicex/tarot</code>. All 78 cards authored for both upright and reversed meanings.</p>
  </footer>

  <script>
    document.addEventListener('alpine:init', () => {
      window.Alpine.data('syzygy', () => ({
        profile: Alpine.$persist({
          name: '',
          age: 30,
          resonance: 'Unspecified',
          drawn_to: 'Prefer not to say',
          birth_date: '',
          birth_time: '',
          birth_place: '',
          spread: 'hear-help-hold',
          question: '',
        }).as('syzygy_profile'),
      }))
    })
  </script>
</body>
</html>
