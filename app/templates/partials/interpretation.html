<section class="interpretation"
         hx-ext="sse"
         sse-connect="/readings/{{ share_slug }}/interpret">
  <header class="interpretation__head">
    <h3 class="interpretation__title">The combined reading</h3>
    <p class="interpretation__sub" data-sse-swap="error" hx-swap="innerHTML">
      Generating your interpretation…
    </p>
  </header>

  <div class="interpretation__body" data-sse-swap="token" hx-swap="innerHTML"></div>

  <div class="interpretation__placeholder" data-sse-swap="error" hx-swap="innerHTML">
    <p>The interpretation could not be generated right now. Your cards above are still yours to read.</p>
  </div>
</section>
